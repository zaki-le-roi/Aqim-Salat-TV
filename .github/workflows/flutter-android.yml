name: Flutter Android TV build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Verify Flutter and Dart SDK versions
        run: |
          flutter --version
          dart --version
      - name: Resolve packages
        run: flutter pub get
      - name: Prepare Android local properties
        working-directory: android
        run: printf "flutter.sdk=%s\nsdk.dir=%s\n" "$(dirname "$(dirname "$(command -v flutter)")")" "$ANDROID_SDK_ROOT" > local.properties
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.14.3
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Run tests
        run: flutter test
      - name: Prepare audio assets
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bash tools/fetch_audio.sh
      - name: Analyze
        run: flutter analyze
      - name: Build Android APK
        run: flutter build apk --release
      - name: Report packaged audio files
        if: always()
        run: |
          find android/app/src/main/res/raw -maxdepth 1 -type f -printf "%f %s bytes\\n" || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aqim-salat-tv-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
