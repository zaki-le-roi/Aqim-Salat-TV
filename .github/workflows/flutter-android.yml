name: Flutter Android TV build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Resolve packages
        run: flutter pub get
      - name: Prepare Android local properties
        working-directory: android
        run: printf "flutter.sdk=%s\nsdk.dir=%s\n" "$(dirname "$(dirname "$(command -v flutter)")")" "$ANDROID_SDK_ROOT" > local.properties
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.14.3
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Run tests
        run: flutter test
      - name: Analyze
        run: flutter analyze
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aqim-salat-tv-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
